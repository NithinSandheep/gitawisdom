name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer==1.5.0 cython==0.29.36
      
      - name: Build APK
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Gita Wisdom
          package.name = gitawisdom
          package.domain = org.gita.app
          version = 1.0
          source.dir = .
          source.include_exts = py,json,mp3
          requirements = python3,kivy==2.3.0
          orientation = portrait
          android.api = 33
          android.minapi = 21
          android.archs = arm64-v8a
          android.permissions = INTERNET
          android.ndk = 25b
          p4a.bootstrap = sdl2
          fullscreen = 0

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          rm -rf .buildozer
          yes | buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gitawisdom-apk
          path: bin/*.apk
