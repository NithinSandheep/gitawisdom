name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.36
      
      - name: Build APK
        run: |
          buildozer init
          sed -i 's/^requirements =.*/requirements = python3,kivy==2.3.0,plyer/' buildozer.spec
          sed -i 's/^android.api =.*/android.api = 33/' buildozer.spec
          sed -i 's/^android.minapi =.*/android.minapi = 21/' buildozer.spec
          sed -i 's/^android.arch =.*/android.archs = arm64-v8a/' buildozer.spec
          sed -i 's/^android.ndk =.*/android.ndk = 25b/' buildozer.spec
          sed -i 's/^source.include_exts =.*/source.include_exts = py,json,mp3/' buildozer.spec
          sed -i 's/^orientation =.*/orientation = portrait/' buildozer.spec
          sed -i 's/^fullscreen =.*/fullscreen = 0/' buildozer.spec
          yes | buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gitawisdom-apk
          path: bin/*.apk
